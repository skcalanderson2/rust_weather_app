[package]
name = "weather_app"
version = "1.0.0"
edition = "2024"
description = "Raspberry Pi weather display (Rust/iced port of the Xojo WeatherApp)"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "image", "svg", "canvas", "tokio", "web-colors", "thread-pool", "x11", "wayland"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
